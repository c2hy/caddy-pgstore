name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release and publish amd64 image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
      CADDY_VERSION: 2.11.4
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          git fetch origin main --no-tags --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

      - name: Validate TCR image variable
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TCR_IMAGE" || "$TCR_IMAGE" == *://* || "$TCR_IMAGE" != */* ]]; then
            echo "TCR_IMAGE must be a full registry path without a scheme or tag" >&2
            exit 1
          fi
          image_path="${TCR_IMAGE#*/}"
          if [[ "$image_path" == *:* ]]; then
            echo "TCR_IMAGE must not include an image tag" >&2
            exit 1
          fi
          echo "host=${TCR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          # Tencent Cloud's shared registry accepts the image manifest but not
          # BuildKit's default OCI provenance attachment.
          provenance: false
          tags: ${{ vars.TCR_IMAGE }}:${{ github.ref_name }}
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            PGSTORE_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Caddy with caddy-pgstore
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=caddy-pgstore
          cache-to: type=gha,mode=max,scope=caddy-pgstore

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
